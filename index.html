<style>
:root{--bg:#060b12;--panel:#0c141e;--panel2:#111c28;--line:#1d2c3b;--text:#eef5fb;--muted:#8ba0b2;--green:#29d986;--red:#ff6077;--yellow:#ffd166;--blue:#61a8ff;--purple:#aa82ff;--cyan:#44d9e8;--shadow:0 20px 55px rgba(0,0,0,.35)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#15344d 0,transparent 35%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{position:sticky;top:0;height:100vh;background:rgba(7,14,22,.94);border-right:1px solid var(--line);padding:18px 13px;z-index:5}.brand{font-weight:950;font-size:22px;padding:10px}.brand span{color:var(--green)}.tag{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:3px 6px;border-radius:99px}.nav{margin-top:20px}.nav button{width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:12px;border-radius:10px;margin:3px 0}.nav button:hover,.nav button.active{background:#122538;color:#fff}.side-title{font-size:10px;color:#60778a;margin:22px 10px 8px;text-transform:uppercase;letter-spacing:1px}.main{width:100%;max-width:1650px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:27px}.sub{color:var(--muted);margin-top:5px}.btn{border:1px solid var(--line);background:#111f2c;color:#fff;border-radius:10px;padding:10px 14px}.btn:hover{filter:brightness(1.15)}.primary{border:0;background:linear-gradient(135deg,#30df8b,#16a768);color:#04120b;font-weight:900}.danger{background:#35151d;color:#ff9aaa}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}.card,.panel{background:linear-gradient(180deg,#0e1924,#0a121b);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.card{padding:15px}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}.num{font-size:25px;font-weight:950;margin-top:6px}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.blue{color:var(--blue)}.purple{color:var(--purple)}.grid{display:grid;grid-template-columns:2fr 1fr;gap:13px;margin-top:13px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:13px}.panel{padding:16px}.panel h2,.panel h3{margin:0 0 12px}.chart{height:290px;position:relative}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.input,select,textarea{background:#07111a;border:1px solid #24384a;color:#fff;border-radius:9px;padding:10px;outline:none}.input:focus,select:focus,textarea:focus{border-color:#4c82aa}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1100px}.table th,.table td{padding:10px;border-bottom:1px solid #1a2937;text-align:left;white-space:nowrap}.table th{font-size:10px;color:#7990a2;text-transform:uppercase}.pill{padding:4px 8px;border-radius:99px;font-size:10px;font-weight:900}.win{background:#0b4430;color:#68f2aa}.loss{background:#4d1824;color:#ff8da0}.be{background:#514117;color:#ffe08b}.muted{color:var(--muted)}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.weekday{font-size:10px;color:#7890a2;text-align:center;padding:5px}.day{min-height:88px;background:#08121b;border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer}.day:hover{border-color:#4c7392}.day.empty{background:transparent;border:0;cursor:default}.day.pos{box-shadow:inset 0 3px 0 var(--green)}.day.neg{box-shadow:inset 0 3px 0 var(--red)}.day.flat{box-shadow:inset 0 3px 0 var(--yellow)}.day .d{font-weight:900}.day small{display:block;color:#7d94a6;margin-top:7px;line-height:1.5}.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{display:block;color:#8298aa;font-size:10px;text-transform:uppercase;margin:0 0 5px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:90px;resize:vertical}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:30;padding:16px;align-items:center;justify-content:center}.modal.show{display:flex}.modalbox{background:#0b151f;border:1px solid var(--line);border-radius:17px;max-width:1100px;width:100%;max-height:94vh;overflow:auto;padding:20px}.close{float:right}.matrix{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:7px}.mcell{border:1px solid var(--line);background:#08121b;border-radius:10px;padding:10px}.mcell small{display:block;color:var(--muted);margin-top:5px}.insights{display:grid;gap:8px}.insight{border:1px solid var(--line);background:#08121b;border-radius:10px;padding:11px;line-height:1.5}.ai{background:radial-gradient(circle at 100% 0,#1c2f50 0,transparent 35%),linear-gradient(180deg,#101b2a,#0a131d)}.ai-title{display:flex;align-items:center;gap:9px}.ai-badge{border:1px solid #3a5877;color:#91c8ff;border-radius:99px;padding:4px 7px;font-size:10px}.promptbar{display:flex;gap:8px;margin-top:12px}.promptbar input{flex:1}.hidden{display:none!important}.toast{position:fixed;right:16px;bottom:16px;background:#122536;border:1px solid var(--line);padding:12px 15px;border-radius:10px;z-index:50;display:none}.empty{text-align:center;color:#708799;padding:30px}.mini{font-size:11px;color:var(--muted)}.section-actions{display:flex;gap:7px;flex-wrap:wrap}.kpi{font-size:12px;color:#9ab0c1}.score{font-size:30px;font-weight:950}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.check{display:flex;gap:8px;align-items:center}.check input{accent-color:var(--green)}
@media(max-width:1150px){.cards{grid-template-columns:repeat(3,1fr)}.grid,.grid3,.two{grid-template-columns:1fr}.formgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.app{display:block}.sidebar{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line);padding:10px}.nav{display:flex;overflow:auto;margin-top:7px}.nav button{min-width:120px;text-align:center}.side-title,.side-tools{display:none}.main{padding:12px}.top{align-items:flex-start}.top h1{font-size:22px}.cards{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.calendar{gap:4px}.day{min-height:72px;padding:6px}.day small{font-size:9px}.promptbar{flex-direction:column}}

<body>
<div class="app">
<aside class="sidebar">
 <div class="brand">Trade<span>Vault</span> <span class="tag">PRO</span></div>
 <div class="nav">
  <button class="active" data-page="dashboard">⌂ Dashboard</button><button data-page="trades">▣ Trade History</button><button data-page="calendar">▦ Calendar</button><button data-page="analytics">◈ Deep Analytics</button><button data-page="coach">✦ Real Talk AI</button>
 </div>
 <div class="side-title">Data</div><div class="side-tools">
  <button class="btn" style="width:100%" onclick="openImport()">⇩ Import Excel / CSV</button>

 </div>
 <div class="side-title">Journal rules</div><div class="mini" style="padding:0 10px">Log the setup, context, risk, execution and outcome. The coach only analyses your journal data.</div>
</aside>
<main class="main">
 <div class="top"><div><h1 id="pageTitle">Trading Dashboard</h1><div class="sub">Deep journal analytics • calendar • execution review • data-driven coach</div></div><div class="section-actions"><button class="btn" onclick="quickFilter('month')">This Month</button><button class="btn primary" onclick="openTradeForm()">＋ Add Trade</button></div></div>
 <section id="dashboard" class="page"></section><section id="trades" class="page hidden"></section><section id="calendar" class="page hidden"></section><section id="analytics" class="page hidden"></section><section id="coach" class="page hidden"></section>
</main></div>

<script>
const SEED=[{"id":1,"fullDate":"","date":"31","day":"MONDAY","open":"08:20","close":"13:55","pair":"XAUUSD","session":"TOKOYO","entry":"EXTREME","setup":"FIBONACCI","timeframe":"4H","type":"LONG","proCounter":"COUNTER","bias":"BULLISH","outcome":"LOSS","sl":200.0,"pips":190.0,"plannedRR":3.2,"actualRR":2.5,"logic":"Fibonacci 0.78 + heavy support ","review":"","screenshot":""},{"id":2,"fullDate":"","date":"2","day":"WEDNESDAY","open":"09:15","close":"17:00","pair":"XAUUSD","session":"TOKOYO","entry":"EXTREME","setup":"PATTERN","timeframe":"4H","type":"LONG","proCounter":"COUNTER","bias":"BULLISH","outcome":"WIN","sl":170.0,"pips":1600.0,"plannedRR":9.0,"actualRR":9.0,"logic":".5 fib +fakeout and m neck line break","review":"","screenshot":""},{"id":3,"fullDate":"","date":"2","day":"WEDNESDAY","open":"15:45","close":"19:30","pair":"XAUUSD","session":"LONDON","entry":"EXTREME","setup":"S/R","timeframe":"30M","type":"LONG","proCounter":"PRO","bias":"BULLISH","outcome":"WIN","sl":100.0,"pips":800.0,"plannedRR":7.5,"actualRR":8.0,"logic":"fake out than resistance hold","review":"","screenshot":""},{"id":4,"fullDate":"","date":"3","day":"THURSDAY","open":"16:00","close":"18:20","pair":"XAUUSD","session":"LONDON","entry":"FLIP","setup":"S/R","timeframe":"30M","type":"LONG","proCounter":"PRO","bias":"BULLISH","outcome":"WIN","sl":60.0,"pips":600.0,"plannedRR":12.0,"actualRR":12.0,"logic":"resistance hault 30mins s/r","review":"","screenshot":""},{"id":5,"fullDate":"","date":"4","day":"FRIDAY","open":"","close":"","pair":"","session":"","entry":"","setup":"","timeframe":"","type":"","proCounter":"","bias":"","outcome":"","sl":0.0,"pips":0.0,"plannedRR":0.0,"actualRR":0.0,"logic":"","review":"","screenshot":""}];
const OPTIONS={
 session:['SYDNEY','TOKYO','TOKOYO','LONDON','NEW YORK','NEWYORK'],
 entry:['EXTREME','FLIP','BREAKOUT','RETEST','MARKET','LIMIT'],
 setup:['FIBONACCI','PATTERN','S/R','TRENDLINE','BREAKOUT','LIQUIDITY','ORDER BLOCK','SUPPLY/DEMAND','FAKEOUT','OTHER'],
 timeframe:['5m','15m','30m','1H','4H','DAILY','WEEKLY'], type:['LONG','SHORT'], proCounter:['PRO','COUNTER'], bias:['BULLISH','BEARISH','NEUTRAL'], outcome:['WIN','LOSS','BREAKEVEN'], pair:['XAUUSD','EURUSD','GBPUSD','USDJPY','NAS100','US30','BTCUSD','OTHER']
};
let trades=load(); let charts={}; let filters={}; let selectedMonth=new Date();
function load(){try{const x=JSON.parse(localStorage.getItem('tradevault_v3'));return Array.isArray(x)?x:SEED}catch(e){return SEED}}
function persist(){localStorage.setItem('tradevault_v3',JSON.stringify(trades))}
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function n(v){const x=parseFloat(v);return Number.isFinite(x)?x:0}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function fmt(v,d=2){return n(v).toFixed(d)}
function outcomeClass(o){return o==='WIN'?'win':o==='LOSS'?'loss':'be'}
function stats(a){const w=a.filter(x=>x.outcome==='WIN'),l=a.filter(x=>x.outcome==='LOSS'),be=a.filter(x=>x.outcome==='BREAKEVEN');const wins=w.reduce((s,x)=>s+n(x.actualRR),0),lossAbs=Math.abs(l.reduce((s,x)=>s+n(x.actualRR),0));const total=wins-lossAbs;let eq=0,peak=0,dd=0,cw=0,cl=0,maxW=0,maxL=0;for(const x of a){const r=x.outcome==='LOSS'?-Math.abs(n(x.actualRR)):n(x.actualRR);eq+=r;peak=Math.max(peak,eq);dd=Math.min(dd,eq-peak);if(x.outcome==='WIN'){cw++;cl=0;maxW=Math.max(maxW,cw)}else if(x.outcome==='LOSS'){cl++;cw=0;maxL=Math.max(maxL,cl)}}const winAvg=w.length?wins/w.length:0,lossAvg=l.length?lossAbs/l.length:0;return{n:a.length,w:w.length,l:l.length,be:be.length,wr:a.length?w.length/a.length*100:0,total,avg:a.length?total/a.length:0,pf:lossAbs?wins/lossAbs:0,winAvg,lossAvg,dd,maxW,maxL,pips:a.reduce((s,x)=>s+n(x.pips),0),planned:a.length?a.reduce((s,x)=>s+n(x.plannedRR),0)/a.length:0,actual:a.length?a.reduce((s,x)=>s+n(x.actualRR),0)/a.length:0}}
function group(a,key){const o={};a.forEach(x=>{const k=x[key]||'UNSPECIFIED';(o[k]??=[]).push(x)});return o}
function card(label,value,cls=''){return `<div class="card"><div class="label">${label}</div><div class="num ${cls}">${value}</div></div>`}
function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={}}
function makeChart(id,type,data,options={}){const el=document.getElementById(id);if(!el||typeof Chart==='undefined')return;try{charts[id]=new Chart(el,{type,data,options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#b8c9d6'}}},scales:type==='doughnut'?{}:{x:{ticks:{color:'#7890a2'},grid:{color:'#182735'}},y:{ticks:{color:'#7890a2'},grid:{color:'#182735'}}},...options}})}catch(e){}}
function navigate(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.querySelectorAll('.page').forEach(s=>s.classList.add('hidden'));document.getElementById(page).classList.remove('hidden');document.getElementById('pageTitle').textContent={dashboard:'Trading Dashboard',trades:'Trade History',calendar:'Trading Calendar',analytics:'Deep Analytics',coach:'Real Talk AI Coach'}[page];render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
function render(){destroyCharts();renderDashboard();renderTrades();renderCalendar();renderAnalytics();renderCoach()}
function renderDashboard(){const s=stats(trades);const wins=trades.filter(x=>x.outcome==='WIN').length,loss=trades.filter(x=>x.outcome==='LOSS').length,be=trades.filter(x=>x.outcome==='BREAKEVEN').length;document.getElementById('dashboard').innerHTML=`
 <div class="cards">${card('Total Trades',s.n)}${card('Win Rate',fmt(s.wr,1)+'%',s.wr>=50?'green':'yellow')}${card('Total R',fmt(s.total),s.total>=0?'green':'red')}${card('Profit Factor',fmt(s.pf),s.pf>=1?'green':'red')}${card('Expectancy / Trade',fmt(s.avg)+'R',s.avg>=0?'green':'red')}${card('Max Drawdown',fmt(s.dd)+'R',s.dd>=0?'green':'red')}</div>
 <div class="grid"><div class="panel"><h3>Equity Curve</h3><div class="chart"><canvas id="equityChart"></canvas></div></div><div class="panel"><h3>Outcome Mix</h3><div class="chart"><canvas id="outcomeChart"></canvas></div></div></div>
 <div class="grid3"><div class="panel"><h3>Best Observed Setups</h3>${ranking('setup')}</div><div class="panel"><h3>Session Performance</h3>${ranking('session')}</div><div class="panel"><h3>Execution Snapshot</h3><div class="insights"><div class="insight">Avg planned R:R <b>${fmt(s.planned)}</b></div><div class="insight">Avg actual R:R <b>${fmt(s.actual)}</b></div><div class="insight">Plan → actual gap <b class="${s.actual-s.planned>=0?'green':'red'}">${fmt(s.actual-s.planned)}R</b></div><div class="insight">Max win streak <b>${s.maxW}</b> · loss streak <b>${s.maxL}</b></div><div class="insight">Total pips <b>${fmt(s.pips,0)}</b></div></div></div></div>`;
 let eq=0;const eqData=trades.map((x,i)=>{eq+=x.outcome==='LOSS'?-Math.abs(n(x.actualRR)):n(x.actualRR);return eq});makeChart('equityChart','line',{labels:trades.map((x,i)=>'#'+(i+1)),datasets:[{label:'Cumulative R',data:eqData,borderColor:'#39dd91',backgroundColor:'rgba(57,221,145,.12)',fill:true,tension:.25}]});makeChart('outcomeChart','doughnut',{labels:['WIN','LOSS','BREAKEVEN'],datasets:[{data:[wins,loss,be],backgroundColor:['#29d986','#ff6077','#ffd166'],borderColor:'#0b151f'}]},{plugins:{legend:{position:'bottom'}}})}
function ranking(key){const arr=Object.entries(group(trades,key)).map(([k,a])=>[k,stats(a)]).sort((a,b)=>b[1].total-a[1].total).slice(0,5);return arr.length?arr.map(([k,s])=>`<div class="insight"><b>${esc(k)}</b><br><span class="mini">${s.n} trades · ${fmt(s.wr,0)}% win · </span><span class="${s.total>=0?'green':'red'}">${fmt(s.total)}R</span></div>`).join(''):'<div class="empty">No data yet.</div>'}
function renderTrades(){const q=filters.q?.toLowerCase()||'';let a=trades.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q)).filter(x=>!filters.outcome||x.outcome===filters.outcome).filter(x=>!filters.setup||x.setup===filters.setup).filter(x=>!filters.session||x.session===filters.session).filter(x=>!filters.pair||x.pair===filters.pair);document.getElementById('trades').innerHTML=`<div class="panel"><div class="section-actions"><button class="btn primary" onclick="openTradeForm()">＋ New Trade</button><button class="btn" onclick="clearFilters()">Clear Filters</button></div><div class="filters"><input class="input" placeholder="Search pair, logic, setup..." value="${esc(filters.q||'')}" oninput="filters.q=this.value;renderTrades()">${selectFilter('outcome','Outcome')}${selectFilter('setup','Setup')}${selectFilter('session','Session')}${selectFilter('pair','Pair')}</div><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>Date</th><th>Pair</th><th>Setup</th><th>Session</th><th>Entry</th><th>TF</th><th>Type</th><th>PRO/Counter</th><th>Bias</th><th>Outcome</th><th>Plan RR</th><th>Actual RR</th><th>Pips</th><th></th></tr></thead><tbody>${a.length?a.map(x=>{const i=trades.indexOf(x);return `<tr><td>${i+1}</td><td>${esc(displayDate(x))}</td><td><b>${esc(x.pair)}</b></td><td>${esc(x.setup)}</td><td>${esc(x.session)}</td><td>${esc(x.entry)}</td><td>${esc(x.timeframe)}</td><td>${esc(x.type)}</td><td>${esc(x.proCounter)}</td><td>${esc(x.bias)}</td><td><span class="pill ${outcomeClass(x.outcome)}">${esc(x.outcome)}</span></td><td>${fmt(x.plannedRR)}</td><td>${fmt(x.actualRR)}</td><td>${fmt(x.pips,0)}</td><td><button class="btn" onclick="viewTrade(${i})">View</button></td></tr>`}).join(''):'<tr><td colspan="15" class="empty">No trades match the filters.</td></tr>'}</tbody></table></div></div>`}
function selectFilter(k,label){return `<select onchange="filters.${k}=this.value;renderTrades()"><option value="">${label}: All</option>${OPTIONS[k].map(v=>`<option ${filters[k]===v?'selected':''}>${v}</option>`).join('')}</select>`}
function clearFilters(){filters={};renderTrades()}
function displayDate(x){if(x.fullDate)return x.fullDate;return x.date||'—'}
function renderCalendar(){const y=selectedMonth.getFullYear(),m=selectedMonth.getMonth();const first=new Date(y,m,1),last=new Date(y,m+1,0);let start=(first.getDay()+6)%7;let html=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<start;i++)html+='<div class="day empty"></div>';for(let d=1;d<=last.getDate();d++){const a=trades.filter(x=>dateParts(x).y===y&&dateParts(x).m===m+1&&dateParts(x).d===d);const s=stats(a);const cls=!a.length?'':s.total>0?'pos':s.total<0?'neg':'flat';html+=`<div class="day ${cls}" onclick="openDay(${y},${m+1},${d})"><div class="d">${d}</div>${a.length?`<small>${a.length} trade${a.length>1?'s':''}<br><b class="${s.total>=0?'green':'red'}">${fmt(s.total)}R</b> · ${fmt(s.wr,0)}%</small>`:'<small>—</small>'}</div>`}document.getElementById('calendar').innerHTML=`<div class="panel"><div class="calendar-head"><button class="btn" onclick="changeMonth(-1)">‹</button><h2>${selectedMonth.toLocaleString('en',{month:'long',year:'numeric'})}</h2><button class="btn" onclick="changeMonth(1)">›</button></div><div class="calendar">${html}</div></div>`}
function dateParts(x){if(x.fullDate){const d=new Date(x.fullDate+'T00:00:00');return{y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate()}}let d=parseInt(x.date);return{y:new Date().getFullYear(),m:selectedMonth.getMonth()+1,d:d}}
function changeMonth(v){selectedMonth.setMonth(selectedMonth.getMonth()+v);renderCalendar()}
function openDay(y,m,d){const a=trades.filter(x=>dateParts(x).y===y&&dateParts(x).m===m&&dateParts(x).d===d);if(!a.length){openTradeForm(y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'));return}document.getElementById('modalbox').innerHTML=`<button class="btn close" onclick="closeModal()">Close</button><h2>${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}</h2><p class="muted">${a.length} trade(s) · ${fmt(stats(a).total)}R</p>${a.map(x=>`<div class="insight" style="margin:8px 0"><b>${esc(x.pair)} · ${esc(x.setup)}</b> · <span class="pill ${outcomeClass(x.outcome)}">${x.outcome}</span><br><span class="mini">${esc(x.session)} · ${esc(x.type)} · Actual R:R ${fmt(x.actualRR)} · ${fmt(x.pips,0)} pips</span></div>`).join('')}`;showModal()}
function renderAnalytics(){const s=stats(trades);document.getElementById('analytics').innerHTML=`<div class="cards">${card('Expectancy',fmt(s.avg)+'R',s.avg>=0?'green':'red')}${card('Avg Win',fmt(s.winAvg)+'R','green')}${card('Avg Loss',fmt(s.lossAvg)+'R','red')}${card('Max Win Streak',s.maxW)}${card('Max Loss Streak',s.maxL)}${card('Total Pips',fmt(s.pips,0))}</div><div class="grid"><div class="panel"><h3>Breakdown Explorer</h3><div class="filters">${['setup','session','timeframe','type','proCounter','bias','entry','pair'].map(k=>`<button class="btn" onclick="breakdown('${k}')">${k}</button>`).join('')}</div><div id="breakdown"></div></div><div class="panel"><h3>Plan vs Actual R:R</h3><div class="chart"><canvas id="rrChart"></canvas></div></div></div><div class="grid3"><div class="panel"><h3>Session × Setup</h3><div class="matrix">${matrix('session','setup')}</div></div><div class="panel"><h3>Time-of-day</h3>${hourAnalysis()}</div><div class="panel"><h3>Journal Quality</h3>${quality()}</div></div>`;breakdown('setup');makeChart('rrChart','bar',{labels:trades.map((_,i)=>'#'+(i+1)),datasets:[{label:'Planned R:R',data:trades.map(x=>n(x.plannedRR)),backgroundColor:'#61a8ff'},{label:'Actual R:R',data:trades.map(x=>n(x.actualRR)),backgroundColor:'#29d986'}]})}
function breakdown(key){const el=document.getElementById('breakdown');if(!el)return;const rows=Object.entries(group(trades,key)).map(([k,a])=>[k,stats(a)]).sort((a,b)=>b[1].total-a[1].total);el.innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>${key}</th><th>Trades</th><th>Wins</th><th>Losses</th><th>Win %</th><th>Avg R</th><th>PF</th><th>Total R</th><th>Avg Plan</th><th>Avg Actual</th></tr></thead><tbody>${rows.map(([k,s])=>`<tr><td><b>${esc(k)}</b></td><td>${s.n}</td><td>${s.w}</td><td>${s.l}</td><td>${fmt(s.wr,1)}%</td><td>${fmt(s.avg)}</td><td>${fmt(s.pf)}</td><td class="${s.total>=0?'green':'red'}">${fmt(s.total)}</td><td>${fmt(s.planned)}</td><td>${fmt(s.actual)}</td></tr>`).join('')}</tbody></table></div>`}
function matrix(a,b){const A=Object.keys(group(trades,a)),B=Object.keys(group(trades,b));if(!A.length||!B.length)return '<div class="empty">Add more trades to unlock the matrix.</div>';return A.flatMap(av=>B.map(bv=>{const s=stats(trades.filter(x=>x[a]===av&&x[b]===bv));return `<div class="mcell"><b>${esc(av)}</b> × ${esc(bv)}</b><small>${s.n} trades · ${fmt(s.wr,0)}% · <span class="${s.total>=0?'green':'red'}">${fmt(s.total)}R</span></small></div>`})).join('')}
function hourAnalysis(){const g={};trades.forEach(x=>{if(x.open){const h=x.open.slice(0,2);(g[h]??=[]).push(x)}});const r=Object.entries(g).map(([h,a])=>[h,stats(a)]).sort((a,b)=>b[1].total-a[1].total);return r.length?r.map(([h,s])=>`<div class="insight"><b>${h}:00–${h}:59</b> · ${s.n} trades · <span class="${s.total>=0?'green':'red'}">${fmt(s.total)}R</span></div>`).join(''):'<div class="empty">Open times are needed for hourly analysis.</div>'}
function quality(){const fields=['logic','open','close','sl','plannedRR','actualRR','setup','session','bias'];return fields.map(k=>{const c=trades.filter(x=>x[k]!==''&&x[k]!==null&&x[k]!==undefined).length;return `<div class="insight">${k} filled <b>${c}/${trades.length}</b> · ${trades.length?fmt(c/trades.length*100,0):0}%</div>`}).join('')}
function renderCoach(){const s=stats(trades);const setup=Object.entries(group(trades,'setup')).map(([k,a])=>[k,stats(a)]).sort((a,b)=>a[1].total-b[1].total);const sess=Object.entries(group(trades,'session')).map(([k,a])=>[k,stats(a)]).sort((a,b)=>b[1].total-a[1].total);const pro=stats(trades.filter(x=>x.proCounter==='PRO')),counter=stats(trades.filter(x=>x.proCounter==='COUNTER'));const gaps=trades.map(x=>n(x.actualRR)-n(x.plannedRR));const avgGap=gaps.length?gaps.reduce((a,b)=>a+b,0)/gaps.length:0;let insights=[];if(s.n<20)insights.push('Your sample is still small. Treat patterns as observations, not proof.');if(setup[0])insights.push(`Lowest observed setup by total R: ${setup[0][0]} (${fmt(setup[0][1].total)}R, ${fmt(setup[0][1].wr,0)}% win). Review the individual trades before changing your rules.`);if(sess[0])insights.push(`Highest observed session by total R: ${sess[0][0]} (${fmt(sess[0][1].total)}R).`);if(pro.n&&counter.n)insights.push(`PRO vs COUNTER: PRO ${fmt(pro.wr,0)}% / ${fmt(pro.total)}R; COUNTER ${fmt(counter.wr,0)}% / ${fmt(counter.total)}R.`);if(s.dd<0)insights.push(`Observed max drawdown is ${fmt(s.dd)}R. Use it to review risk discipline and losing streak behaviour.`);if(Math.abs(avgGap)>.5)insights.push(`Average plan-to-actual R:R gap is ${fmt(avgGap)}R. Review whether execution or exits are changing the original plan.`);document.getElementById('coach').innerHTML=`<div class="panel ai"><div class="ai-title"><h2>✦ Real Talk AI Coach</h2><span class="ai-badge">JOURNAL-DATA MODE</span></div><p class="muted">No generic market predictions. This coach reads your logged setup, session, entry, bias, risk and outcome fields.</p><div class="insights">${insights.map(x=>`<div class="insight">• ${esc(x)}</div>`).join('')}</div><div class="promptbar"><input id="aiq" class="input" placeholder="Ask: Why am I losing? Best setup? Session? PRO vs COUNTER? Risk?" onkeydown="if(event.key==='Enter')askCoach()"><button class="btn primary" onclick="askCoach()">Ask Coach</button></div><div id="aiAnswer" style="margin-top:10px"></div></div><div class="grid3"><div class="panel"><h3>Behaviour Review</h3>${['Did I follow the setup rule?','Was the entry confirmation present?','Was SL defined before entry?','Was this PRO or COUNTER—and why?','Did exit match the original plan?','Did emotion influence the trade?'].map(x=>`<label class="check insight"><input type="checkbox"> ${x}</label>`).join('')}</div><div class="panel"><h3>What the coach can detect</h3>${['Weak setups','Strong sessions','Long vs Short','PRO vs COUNTER','Bias performance','Entry-model performance','Time-of-day patterns','Plan vs actual R:R','Streaks & drawdown','Missing journal fields'].map(x=>`<div class="insight">✦ ${x}</div>`).join('')}</div><div class="panel"><h3>Coach data snapshot</h3><div class="score">${fmt(s.wr,0)}%</div><div class="kpi">Win rate</div><div class="score ${s.total>=0?'green':'red'}">${fmt(s.total)}R</div><div class="kpi">Net observed R</div><div class="score">${s.maxW}/${s.maxL}</div><div class="kpi">Max win / loss streak</div></div></div>`}
function askCoach(){const q=(document.getElementById('aiq').value||'').toLowerCase();const answer=coachAnswer(q);document.getElementById('aiAnswer').innerHTML=`<div class="insight"><b>Real Talk:</b> ${esc(answer)}</div>`}
function coachAnswer(q){const s=stats(trades);if(!trades.length)return'No trades yet. Add or import trades first.';if(/weak|mistake|losing|problem/.test(q)){const r=Object.entries(group(trades,'setup')).map(([k,a])=>[k,stats(a)]).filter(x=>x[1].n>=2).sort((a,b)=>a[1].wr-b[1].wr);return r[0]?`${r[0][0]} has your lowest observed win rate among setups with at least 2 trades: ${fmt(r[0][1].wr,0)}% across ${r[0][1].n} trades and ${fmt(r[0][1].total)}R. Open those trades and check rule adherence before concluding the setup itself is the issue.`:'Not enough repeated setup data to identify a weakness.'}if(/session/.test(q)){return Object.entries(group(trades,'session')).map(([k,a])=>{const x=stats(a);return`${k}: ${x.n} trades, ${fmt(x.wr,0)}% win, ${fmt(x.total)}R`}).join(' · ')}if(/setup/.test(q)){return Object.entries(group(trades,'setup')).map(([k,a])=>{const x=stats(a);return`${k}: ${x.n} trades, ${fmt(x.wr,0)}% win, ${fmt(x.total)}R`}).join(' · ')}if(/pro|counter/.test(q)){const p=stats(trades.filter(x=>x.proCounter==='PRO')),c=stats(trades.filter(x=>x.proCounter==='COUNTER'));return`PRO: ${p.n} trades, ${fmt(p.wr,0)}% win, ${fmt(p.total)}R. COUNTER: ${c.n} trades, ${fmt(c.wr,0)}% win, ${fmt(c.total)}R.`}if(/risk|drawdown|safe/.test(q))return`Observed max drawdown is ${fmt(s.dd)}R, average expectancy is ${fmt(s.avg)}R/trade, and max losing streak is ${s.maxL}. These are historical journal metrics, not a forecast.`;if(/rr|risk reward|plan|exit/.test(q))return`Average planned R:R is ${fmt(s.planned)}, actual R:R is ${fmt(s.actual)}, with a ${fmt(s.actual-s.planned)}R average gap. Review trades where actual R:R diverged most from plan.`;if(/bias/.test(q))return Object.entries(group(trades,'bias')).map(([k,a])=>{const x=stats(a);return`${k}: ${x.n} trades, ${fmt(x.wr,0)}% win, ${fmt(x.total)}R`}).join(' · ');return`I can analyse ${s.n} logged trades. Ask about weakness, setups, sessions, PRO vs COUNTER, bias, R:R, risk/drawdown, or execution.`}
function openTradeForm(date=''){const sel=(k,placeholder='Select')=>`<select id="f_${k}"><option value="">${placeholder}</option>${OPTIONS[k].map(v=>`<option>${v}</option>`).join('')}</select>`;document.getElementById('modalbox').innerHTML=`<button class="btn close" onclick="closeModal()">Close</button><h2>＋ Add Trade</h2><p class="muted">Capture enough context so analytics and the coach can learn from the trade.</p><div class="formgrid"><div class="field"><label>Full Date</label><input id="f_fullDate" type="date" value="${date}"></div><div class="field"><label>Open Time</label><input id="f_open" type="time"></div><div class="field"><label>Close Time</label><input id="f_close" type="time"></div><div class="field"><label>Pair</label>${sel('pair')}</div><div class="field"><label>Session</label>${sel('session')}</div><div class="field"><label>Entry Model</label>${sel('entry')}</div><div class="field"><label>Setup</label>${sel('setup')}</div><div class="field"><label>Timeframe</label>${sel('timeframe')}</div><div class="field"><label>Direction</label>${sel('type')}</div><div class="field"><label>PRO / COUNTER</label>${sel('proCounter')}</div><div class="field"><label>Bias</label>${sel('bias')}</div><div class="field"><label>Outcome</label>${sel('outcome')}</div><div class="field"><label>Stop Loss / Risk</label><input id="f_sl" type="number" step="any"></div><div class="field"><label>Pips</label><input id="f_pips" type="number" step="any"></div><div class="field"><label>Planned R:R</label><input id="f_plannedRR" type="number" step="any"></div><div class="field"><label>Actual R:R</label><input id="f_actualRR" type="number" step="any"></div><div class="field full"><label>Trade Logic / Thesis</label><textarea id="f_logic" placeholder="Why did you enter? What confirmation did you see?"></textarea></div><div class="field full"><label>Post-Trade Review</label><textarea id="f_review" placeholder="What went right/wrong? Rule break? Emotion? Lesson?"></textarea></div><div class="field full"><label>Screenshot URL (optional)</label><input id="f_screenshot" placeholder="Paste a public image URL if you have one"></div></div><div style="margin-top:15px;display:flex;justify-content:flex-end;gap:8px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTrade()">Save Trade</button></div>`;showModal()}
function val(k){return document.getElementById('f_'+k)?.value||''}
function saveTrade(){const x={id:Date.now(),fullDate:val('fullDate'),date:val('fullDate')?val('fullDate').slice(-2):'',open:val('open'),close:val('close'),pair:val('pair'),session:val('session'),entry:val('entry'),setup:val('setup'),timeframe:val('timeframe'),type:val('type'),proCounter:val('proCounter'),bias:val('bias'),outcome:val('outcome'),sl:n(val('sl')),pips:n(val('pips')),plannedRR:n(val('plannedRR')),actualRR:n(val('actualRR')),logic:val('logic'),review:val('review'),screenshot:val('screenshot')};if(!x.fullDate||!x.pair||!x.outcome){toast('Date, pair and outcome are required');return}trades.push(x);persist();closeModal();render();toast('Trade saved')}
function viewTrade(i){const x=trades[i];document.getElementById('modalbox').innerHTML=`<button class="btn close" onclick="closeModal()">Close</button><h2>${esc(x.pair)} · ${esc(x.setup||'Trade')}</h2><div class="cards"><div class="card"><div class="label">Outcome</div><div class="num ${x.outcome==='WIN'?'green':x.outcome==='LOSS'?'red':'yellow'}">${esc(x.outcome)}</div></div><div class="card"><div class="label">Actual R:R</div><div class="num">${fmt(x.actualRR)}</div></div><div class="card"><div class="label">Planned R:R</div><div class="num">${fmt(x.plannedRR)}</div></div><div class="card"><div class="label">Pips</div><div class="num">${fmt(x.pips,0)}</div></div></div><div class="two" style="margin-top:13px"><div class="panel"><h3>Execution</h3><div class="insights"><div class="insight">Date: <b>${esc(displayDate(x))}</b></div><div class="insight">Time: <b>${esc(x.open||'—')} → ${esc(x.close||'—')}</b></div><div class="insight">Session: <b>${esc(x.session)}</b></div><div class="insight">Entry: <b>${esc(x.entry)}</b></div><div class="insight">Timeframe: <b>${esc(x.timeframe)}</b></div><div class="insight">Direction: <b>${esc(x.type)}</b> · ${esc(x.proCounter)} · ${esc(x.bias)}</div><div class="insight">SL/Risk: <b>${fmt(x.sl)}</b></div></div></div><div class="panel"><h3>Journal Review</h3><div class="insight">${esc(x.logic||'No trade thesis recorded.')}</div><div class="insight" style="margin-top:8px">${esc(x.review||'No post-trade review recorded.')}</div>${x.screenshot?`<div class="insight" style="margin-top:8px"><a href="${esc(x.screenshot)}" target="_blank" rel="noopener">Open screenshot ↗</a></div>`:''}</div></div><div style="margin-top:14px"><button class="btn danger" onclick="deleteTrade(${i})">Delete Trade</button></div>`;showModal()}
function deleteTrade(i){if(confirm('Delete this trade?')){trades.splice(i,1);persist();closeModal();render();toast('Deleted')}}
function showModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
function openImport(){document.getElementById('fileImport').click()}
document.getElementById('fileImport').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{if(f.name.toLowerCase().endsWith('.json')){const x=JSON.parse(ev.target.result);if(Array.isArray(x)){trades=x;persist();render();toast('JSON imported');return}}if(typeof XLSX==='undefined'){alert('Excel engine could not load. Use CSV or JSON.');return}const wb=XLSX.read(ev.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:''});const mapped=rows.map(mapRow).filter(x=>x.pair||x.setup||x.outcome);if(mapped.length){trades=mapped;persist();render();toast(`${mapped.length} trades imported`)}else alert('No usable trade rows found.')}catch(err){alert('Import failed: '+err.message)}};r.readAsArrayBuffer(f);e.target.value=''}
function mapRow(r){const get=(...keys)=>{for(const k of keys){if(r[k]!==undefined&&r[k]!=='')return r[k]}return''};const d=get('DATE','Date');let fullDate='';if(d instanceof Date)fullDate=d.toISOString().slice(0,10);else if(/^\d{4}[-/]\d{1,2}[-/]\d{1,2}$/.test(String(d)))fullDate=String(d).replaceAll('/','-');return{id:Date.now()+Math.random(),fullDate,date:fullDate?fullDate.slice(-2):String(d||''),day:get('DAY','Day'),open:timeValue(get('TIME(OPEN)','TIME OPEN','OPEN')),close:timeValue(get('TIME(CLOSED)','TIME CLOSED','CLOSED')),pair:String(get('PAIR','Pair')).toUpperCase(),session:String(get('SESSION','Session')).toUpperCase(),entry:String(get('ENTRY','Entry')).toUpperCase(),setup:String(get('SETUP','Setup')).toUpperCase(),timeframe:String(get('TIME FRAME','TIMEFRAME','Time Frame')).toUpperCase(),type:String(get('TYPE','Type')).toUpperCase(),proCounter:String(get('PRO/COUNTER','PRO COUNTER','Pro/Counter')).toUpperCase(),bias:String(get('BIAS','BAIS','Bias')).toUpperCase(),outcome:String(get('OUTCOME','Outcome')).toUpperCase(),sl:n(get('STOP LOSS','SL')),pips:n(get('PIPS','Pips')),plannedRR:n(get('RISK REWARD','RISKREWARD','Planned RR')),actualRR:n(get('ACTUAL R:R','ACTUAL RR','Actual R:R')),logic:String(get('TRADE LOGIC','Trade Logic')),review:String(get('POST TRADE REVIEW','REVIEW','Review'))}}
function timeValue(v){if(!v)return'';if(typeof v==='number'){const total=Math.round(v*24*60);return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0')}return String(v).slice(0,5)}
function exportJSON(){const blob=new Blob([JSON.stringify(trades,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tradevault-backup.json';a.click();URL.revokeObjectURL(a.href)}
function resetDemo(){if(confirm('Reset the journal to the included demo/sample trades?')){trades=SEED.map(x=>({...x,id:Date.now()+Math.random()}));persist();render();toast('Demo reset')}}
function quickFilter(){navigate('trades')}
render();
